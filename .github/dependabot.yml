version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/momentum/website"
    schedule:
      interval: "weekly"
    groups:
      website-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
