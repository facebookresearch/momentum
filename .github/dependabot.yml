version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/momentum/website"
    schedule:
      interval: "weekly"
    groups:
      # Docusaurus requires all official packages to use the same version.
      docusaurus:
        patterns:
          - "@docusaurus/*"
        update-types:
          - "minor"
          - "patch"
      website-dependencies:
        # Keep major upgrades separate because they can require source changes.
        patterns:
          - "*"
        exclude-patterns:
          - "@docusaurus/*"
          - "docusaurus-plugin-internaldocs-fb"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Version 1.20.0 pins @docusaurus/theme-mermaid 2.4.3 and is
      # incompatible with Docusaurus 3.
      - dependency-name: "docusaurus-plugin-internaldocs-fb"
        versions:
          - "1.20.0"
